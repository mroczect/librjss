name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: linux-aarch64
            cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross linker
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: build ffi
        run: cargo build -p librjss-ffi --release --target ${{ matrix.target }}

      - name: build verify_readonly
        run: cargo build --release --bin verify_readonly --target ${{ matrix.target }}

      - name: pack
        shell: bash
        run: |
          mkdir -p dist/ffi dist/bin
          T=target/${{ matrix.target }}/release

          cp $T/liblibrjss_ffi.so   dist/ffi/ 2>/dev/null || true
          cp $T/liblibrjss_ffi.dylib dist/ffi/ 2>/dev/null || true
          cp $T/librjss_ffi.dll     dist/ffi/ 2>/dev/null || true

          cp $T/liblibrjss_ffi.a    dist/ffi/ 2>/dev/null || true
          cp $T/librjss_ffi.lib     dist/ffi/ 2>/dev/null || true

          cp librjss-ffi/include/librjss.h dist/ffi/

          cp $T/verify_readonly     dist/bin/ 2>/dev/null || true
          cp $T/verify_readonly.exe dist/bin/ 2>/dev/null || true

          cd dist/ffi
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            7z a ../../librjss-ffi-${{ github.ref_name }}-${{ matrix.name }}.zip .
          else
            tar czf ../../librjss-ffi-${{ github.ref_name }}-${{ matrix.name }}.tar.gz .
          fi
          cd ../..

          cd dist/bin
          if [[ "${{ matrix.name }}" == windows-* ]]; then
            mv verify_readonly.exe verify_readonly-${{ github.ref_name }}-${{ matrix.name }}.exe
          else
            mv verify_readonly verify_readonly-${{ github.ref_name }}-${{ matrix.name }}
            chmod +x verify_readonly-${{ github.ref_name }}-${{ matrix.name }}
          fi
          cd ../..

      - name: checksum
        shell: bash
        run: |
          cd dist
          find . -type f -exec sha256sum {} \; | sed 's|\./||' >> ../SHA256SUMS.tmp || true
          cd ..
          sort -u SHA256SUMS.tmp > SHA256SUMS-${{ matrix.name }}
          rm SHA256SUMS.tmp

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            librjss-ffi-*.tar.gz
            librjss-ffi-*.zip
            verify_readonly-*
            SHA256SUMS-${{ matrix.name }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: merge checksums
        run: |
          cat artifacts/SHA256SUMS-* | sort -u > SHA256SUMS
          rm artifacts/SHA256SUMS-*

      - name: copy man page
        run: cp docs/librjss.3 artifacts/librjss.3

      - name: list
        run: ls -la artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/librjss-ffi-*.tar.gz
            artifacts/librjss-ffi-*.zip
            artifacts/verify_readonly-*
            artifacts/librjss.3
            SHA256SUMS
