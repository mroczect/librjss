[package]
name = "librjss"
version = "2.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["mroczect <mroczect@proton.me>"]
description = "Robust async Rust client for Juragan Subsystem (JSS) / Frappe / ERPNext APIs"
license = "MIT"
repository = "https://github.com/mroczect/librjss"
homepage = "https://github.com/mroczect/librjss"
documentation = "https://docs.rs/librjss"
readme = "README.md"
keywords = ["frappe", "erpnext", "api-client", "juragan-subsystem", "async"]
categories = ["web-programming", "api-bindings"]
exclude = ["/target", "/.git", "/.github", "/benches", "/examples", "/tests"]

[workspace]
members = ["librjss-ffi"]
resolver = "2"

[workspace.package]
version = "2.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["mroczect <mroczect@proton.me>"]
license = "MIT"
repository = "https://github.com/mroczect/librjss"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "multipart",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
secrecy = { version = "0.10", features = ["serde"] }
backoff = { version = "0.4", features = ["tokio"] }
http = "1"
scraper = "0.18"
urlencoding = "2"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
json5 = "1.3.1"

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
tracing.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
secrecy.workspace = true
backoff.workspace = true
http.workspace = true
scraper.workspace = true
urlencoding.workspace = true
chrono.workspace = true
futures.workspace = true
json5.workspace = true

[dev-dependencies]
wiremock = "0.5"
axum = "0.8.9"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }   # <-- BARU

[[bin]]
name = "verify_readonly"
path = "src/bin/verify_readonly.rs"
